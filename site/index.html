<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Generations</title>
  <meta name="description" content="A video family tree — first-hand stories from the people we come from, kept for the generations still to come." />
  <meta name="theme-color" content="#120d0a" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f5eee3" media="(prefers-color-scheme: light)" />
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <script>
    // Apply saved theme before paint to avoid a flash.
    try { const t = localStorage.getItem('gen-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar glass">
    <a class="brand" href="#/" aria-label="Generations home">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#i-rings" /></svg>
      <span>Generations</span>
    </a>
    <nav class="topnav" aria-label="Primary">
      <a href="#/" data-nav="home">Home</a>
      <a href="#/family/samra" data-nav="family">Family tree</a>
      <a href="#/about" data-nav="about">How it works</a>
    </nav>
    <div class="topbar-actions">
      <button class="icon-btn search-trigger" type="button" data-action="search" aria-label="Find a family member">
        <svg viewBox="0 0 24 24"><use href="#i-search" /></svg>
        <span class="search-hint">Find someone <kbd>⌘K</kbd></span>
      </button>
      <button class="icon-btn" type="button" data-action="theme" aria-label="Toggle light or dark theme">
        <svg viewBox="0 0 24 24"><use href="#i-theme" /></svg>
      </button>
      <button class="btn btn-primary btn-sm hide-mobile" type="button" data-action="upload">
        <svg viewBox="0 0 24 24"><use href="#i-plus" /></svg> Add a video
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <footer class="footer">
    <p>Generations — a video family tree. <span class="mode-note"></span></p>
  </footer>

  <!-- Mobile bottom navigation -->
  <nav class="tabbar glass" aria-label="Mobile">
    <a href="#/" data-nav="home"><svg viewBox="0 0 24 24"><use href="#i-home" /></svg><span>Home</span></a>
    <a href="#/family/samra" data-nav="family"><svg viewBox="0 0 24 24"><use href="#i-tree" /></svg><span>Tree</span></a>
    <button type="button" class="tabbar-fab" data-action="upload" aria-label="Add a video"><svg viewBox="0 0 24 24"><use href="#i-plus" /></svg></button>
    <button type="button" data-action="search"><svg viewBox="0 0 24 24"><use href="#i-search" /></svg><span>Find</span></button>
    <a href="#/about" data-nav="about"><svg viewBox="0 0 24 24"><use href="#i-info" /></svg><span>About</span></a>
  </nav>

  <div class="toasts" role="status" aria-live="polite"></div>
  <dialog class="sheet" id="sheet"></dialog>

  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-rings" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M16 29V17"/><path d="M16 21c-3 0-5.5-1.6-6.5-4"/><path d="M16 19c2.6 0 4.8-1.3 5.8-3.4"/><circle cx="16" cy="11" r="8"/><circle cx="16" cy="11" r="4.6"/><circle cx="16" cy="11" r="1.6" fill="currentColor"/></g></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></g></symbol>
    <symbol id="i-theme" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></g></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5h-5v5H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-tree" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="5" rx="1.5"/><rect x="3" y="16" width="6" height="5" rx="1.5"/><rect x="15" y="16" width="6" height="5" rx="1.5"/><path d="M12 8v4M6 16v-2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2"/></g></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></g></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></g></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="6.5" width="13" height="11" rx="2.5"/><path d="m16 10.5 5-3v9l-5-3z"/></g></symbol>
    <symbol id="i-library" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="9" r="1.5"/></g></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></g></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></g></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></g></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" fill="currentColor"/></symbol>
  </svg>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
